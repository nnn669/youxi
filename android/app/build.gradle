plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dpeng999.farmgame'
    compileSdk 34

    defaultConfig {
        applicationId "com.dpeng999.farmgame"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
            debuggable true
        }
        release {
            minifyEnabled false
            // 首版用 debug 签名便于安装；上线前替换为正式 keystore
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources.excludes += ['META-INF/*']
    }
}
